# ============================================================
# Configuración de Netlify
# ============================================================
[build]
  publish  = "public"
  functions = "netlify/functions"
  # Inyecta las variables públicas en config.js durante el build,
  # para no tener que tocar el archivo a mano en cada ambiente.
  command  = "node scripts/generar-config.js"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# La app es de una sola página y vive en /app: todo lo que cuelgue de ahí
# y no sea un archivo real va a su index. La landing, en la raíz, se sirve sola.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Cabeceras de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# El service worker tiene que revisarse en cada visita: si queda cacheado,
# los cambios tardan días en llegar a los teléfonos.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/fuentes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
