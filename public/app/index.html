<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nivora Fit — tu entrenador personal</title>
<meta name="description" content="Rutina de gimnasio adaptada a tu cuerpo, tu nivel y tus días. Evaluación corporal con grasa corporal, calorías y seguimiento de medidas.">
<meta name="theme-color" content="#0B0B0C">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nivora Fit">
<meta name="color-scheme" content="dark light">

<!-- El tema se decide antes de pintar, para que no parpadee al abrir. -->
<script>
(function () {
  var t = "auto";
  try { t = localStorage.getItem("nivora.tema") || "auto"; } catch (e) {}
  if (t !== "auto") document.documentElement.setAttribute("data-theme", t);
})();
</script>
<meta property="og:title" content="Nivora Fit">
<meta property="og:description" content="Tu entrenador personal: rutina adaptada a tu cuerpo y evaluación corporal completa.">
<meta property="og:type" content="website">
<link rel="preload" href="/fuentes/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fuentes/saira-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fuentes.css">
<link rel="stylesheet" href="/estilos.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <button class="avatar" id="btn-avatar" aria-label="Abrir ajustes y perfil"></button>
    <div class="who" id="who"></div>
    <button class="iconbtn" id="btn-chat" aria-label="Hablar con el entrenador" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1.2-4.2A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14.5h4"/></svg>
    </button>
    <div class="chip" id="chip">—</div>
  </header>

  <section class="view" id="v-acceso" hidden></section>
  <section class="view" id="v-muro" hidden></section>
  <section class="view" id="v-setup" hidden></section>
  <section class="view" id="v-hoy" hidden></section>
  <section class="view" id="v-agenda" hidden></section>
  <section class="view" id="v-ejercicios" hidden>
    <p class="eyebrow" style="margin-bottom:9px">Biblioteca · tocá cualquiera para ver cómo se hace</p>
    <div class="chips" id="lib-chips"></div>
    <div class="exlist" id="lib-list"></div>
  </section>
  <section class="view" id="v-cuerpo" hidden></section>
  <section class="view" id="v-progreso" hidden></section>
  <div id="pie"></div>
</div>

<nav class="tabbar" id="tabbar" role="tablist" hidden>
  <button role="tab" data-tab="hoy" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M6.5 9v6M17.5 9v6M4 10.5v3M20 10.5v3M6.5 12h11"/></svg>Hoy</button>
  <button role="tab" data-tab="agenda" aria-selected="false">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
  <button role="tab" data-tab="ejercicios" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="10" cy="18" r="1.7"/></svg>Ejercicios</button>
  <button role="tab" data-tab="cuerpo" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="4.6" r="2.4"/><path d="M12 7.2v6.5M7.5 9.5h9M9.6 13.7 8.4 20M14.4 13.7 15.6 20"/></svg>Cuerpo</button>
  <button role="tab" data-tab="progreso" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>Progreso</button>
</nav>

<div class="sheet-wrap" id="sheet-wrap">
  <div class="scrim" id="scrim"></div>
  <div class="sheet"><div class="sheet-inner" id="sheet-body"></div></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="photo-input" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<!-- Valores por defecto: si todavía no corriste el build, la app igual abre
     y guarda todo en el teléfono. config.js los pisa en producción. -->
<script>window.CONFIG = { APP_NOMBRE: "Nivora Fit", URL_APP: location.origin,
  SUPABASE_URL: "", SUPABASE_ANON_KEY: "", PRECIO_MENSUAL: 10000, MONEDA: "ARS", DIAS_PRUEBA: 7 };</script>
<script src="/config.js" onerror="void 0"></script>
<script src="/instalar.js"></script>
<script src="/js/dibujos.js"></script>
<script src="/js/ejercicios.js"></script>
<script src="/js/cuerpo.js"></script>
<script src="/js/motor.js"></script>
<script src="/js/interfaz.js"></script>
<script src="/js/entreno.js"></script>
<script src="/js/cardio.js"></script>
<script src="/js/panel.js"></script>
<script src="/js/cuenta.js"></script>
<script src="/js/informe.js"></script>
<script src="/js/clima.js"></script>
<script src="/js/logros.js"></script>
<script src="/js/fotos.js"></script>
<script src="/js/recordatorios.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/entrenador.js"></script>
<script src="/js/nube.js"></script>
<script src="/js/arranque.js"></script>
</body>
</html>
